name: Vale Lint (lab reproduction)

# Reproduces the composition reported in elastic/integrations
# .github/workflows/vale-lint.yml plus elastic/docs-actions vale/lint/action.yml.
#
# The "Select files to lint" step below is copied verbatim from the Elastic
# caller at integrations@8518218716a47fdd55b5e766f15e9fed1e5c3fe2, and the
# sink step inside ./.github/actions/vale-lint-sink is copied verbatim from
# docs-actions@ee16641f86db0d480d1ad49b7de120cbb5cd2f60 vale/lint/action.yml.
#
# Substituted: the rest of the Vale action, which installs and runs the linter.
# None of it sits between the filename and the sink.
#
# The pull request under test does not touch this file or the action, so the
# workflow that runs is the base repository's.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**/docs/README.md'

permissions:
  contents: read
  pull-requests: read

jobs:
  vale-lint:
    name: Lint user-facing content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select files to lint
        id: select-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t changed_files < <(
            gh api "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate \
              | jq -rs 'add // [] | .[] | select(.status != "removed") | .filename'
          )

          files_to_lint=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              packages/**/_dev/build/docs/README.md|\
              packages/**/manifest.yml|\
              packages/**/data_stream/*/fields/fields.yml|\
              packages/**/data_stream/*/manifest.yml|\
              packages/**/changelog.yml)
                files_to_lint+=("$file")
                ;;
              packages/**/docs/README.md)
                package_dir="${file%/docs/README.md}"
                if [ ! -f "$package_dir/_dev/build/docs/README.md" ]; then
                  files_to_lint+=("$file")
                else
                  echo "Skipping $file because $package_dir/_dev/build/docs/README.md exists"
                fi
                ;;
            esac
          done

          if [ "${#files_to_lint[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No matching files to lint"
            exit 0
          fi

          printf 'Files to lint:\n'
          printf '  %s\n' "${files_to_lint[@]}"
          files=$(printf '%s ' "${files_to_lint[@]}")
          echo "files=${files% }" >> "$GITHUB_OUTPUT"
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Run the vendored sink
        if: steps.select-files.outputs.has_files == 'true'
        uses: ./.github/actions/vale-lint-sink
        with:
          files: ${{ steps.select-files.outputs.files }}

      - name: Did anything execute that should not have
        if: always()
        run: |
          echo "--- marker check, added by the lab, not part of the vendored step ---"
          if [ -e PWNED ]; then
            echo "RESULT=EXECUTED  the filename broke out of the quoting and ran a command"
            ls -l PWNED
            echo "runner user: $(whoami)"
            echo "runner host: $(hostname)"
          else
            echo "RESULT=SAFE  no command ran"
          fi
